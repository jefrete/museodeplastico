<style>

html,body{

canvas{

#hud{

#crosshair{

#info p{

#info a{

}

#close{

    top:8px;
    cursor:pointer;

}

#mobile{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
    display:none;

.mobile-btn{
    position:absolute;
    width:55px;
    height:55px;

    background:rgba(0,20,25,.65);

    touch-action:none;
}

#up{

    bottom:145px;
}

#down{

    bottom:25px;
}

#left{

#right{

#look{

    right:0;

    pointer-events:auto;
    touch-action:none;

#instructions{
    position:fixed;
    right:20px;
    top:20px;
    z-index:20;
    text-align:right;
    color:#788;
    font-size:10px;
    line-height:1.6;
    letter-spacing:1px;
    pointer-events:none;
}

@media(max-width:700px){
    #mobile{
        display:block;
    }

    #instructions{
        display:none;
    }

    #hud{
        top:12px;
        left:12px;
    }

    .logo{
        font-size:15px;
    }
}

function wall(
    x,
    z,
    width,
    height,
    rotation=0
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            0.35
        ),
        new THREE.MeshBasicMaterial({
            color:0x070d11
        })
    );

    mesh.position.set(
        x,
        height/2,
        z
    );

    mesh.rotation.y =
    rotation;

    scene.add(mesh);

    return mesh;
}

/* =========================================================

function textSprite(
    text,
    color="#00ffff",
    size=48
){

    const canvas =
    document.createElement("canvas");

    canvas.width=1024;
    canvas.height=256;

    const ctx =
    canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.font =
    `900 ${size}px Arial`;

    ctx.textAlign="center";

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=25;

    ctx.fillText(
        text,
        512,
        140
    );

    const texture =
    new THREE.CanvasTexture(canvas);

    texture.colorSpace =
    THREE.SRGBColorSpace;

    const material =
    new THREE.SpriteMaterial({
        map:texture,
        transparent:true
    });

    const sprite =
    new THREE.Sprite(material);

    sprite.scale.set(
        10,
        2.5,
        1
    );

    return sprite;
}


/* =========================================================
   PANEL / OBRA DE MUSEO
========================================================= */

function createArtwork(
    data,
    x,
    z,
    rotation
){

    const group =
    new THREE.Group();

    group.position.set(
        x,
        3.1,
        z
    );

    group.rotation.y =
    rotation;

    scene.add(group);


    /* MARCO */

    const frame =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            6.6,
            4.5,
            0.25
        ),
        new THREE.MeshBasicMaterial({
            color:0x10191d
        })
    );

    group.add(frame);


    /* PANTALLA */

    const screen =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            6.05,
            3.95,
            0.15
        ),
        new THREE.MeshBasicMaterial({
            color:0x03171b
        })
    );

    screen.position.z =
    -0.18;

    group.add(screen);


    /* BORDE NEON */

    const edges =
    new THREE.LineSegments(
        new THREE.EdgesGeometry(
            new THREE.BoxGeometry(
                6.2,
                4.1,
                0.2
            )
        ),
        new THREE.LineBasicMaterial({
            color:0x00ffff
        })
    );

    edges.position.z =
    -0.3;

    group.add(edges);


    /* MINI UI */

    const uiCanvas =
    document.createElement("canvas");

    uiCanvas.width=900;
    uiCanvas.height=600;

    const ctx =
    uiCanvas.getContext("2d");

    ctx.fillStyle="#020708";
    ctx.fillRect(
        0,0,
        900,600
    );


    /* browser bar */

    ctx.fillStyle="#0d181c";
    ctx.fillRect(
        0,0,
        900,70
    );


    ctx.fillStyle="#ff4d67";
    ctx.beginPath();
    ctx.arc(30,35,9,0,Math.PI*2);
    ctx.fill();


    ctx.fillStyle="#ffd166";
    ctx.beginPath();
    ctx.arc(58,35,9,0,Math.PI*2);
    ctx.fill();


    ctx.fillStyle="#00ffff";
    ctx.beginPath();
    ctx.arc(86,35,9,0,Math.PI*2);
    ctx.fill();


    /* titulo */

    ctx.fillStyle="#00ffff";

    ctx.font=
    "900 42px Arial";

    ctx.fillText(
        data.icon+"  "+data.title,
        45,
        145
    );


    /* categoria */

    ctx.fillStyle="#78898d";

    ctx.font=
    "bold 20px Arial";

    ctx.fillText(
        data.category+" / DIGITAL ARTIFACT",
        48,
        185
    );


    /* tarjetas */

    for(let i=0;i<4;i++){

        ctx.fillStyle =
        i===0
        ? "#07343a"
        : "#0b1417";

        ctx.fillRect(
            45+i*205,
            235,
            175,
            180
        );

        ctx.strokeStyle =
        "#00ffff";

        ctx.globalAlpha=.35;

        ctx.strokeRect(
            45+i*205,
            235,
            175,
            180
        );

        ctx.globalAlpha=1;

        ctx.fillStyle="#00ffff";

        ctx.font="bold 24px Arial";

        ctx.fillText(
            data.icon,
            65+i*205,
            275
        );
    }


    /* descripcion */

    ctx.fillStyle="#9ab";

    ctx.font=
    "18px Arial";

    ctx.fillText(
        data.description,
        48,
        475
    );


    /* boton */

    ctx.fillStyle="#00ffff";

    ctx.fillRect(
        48,
        510,
        190,
        45
    );

    ctx.fillStyle="#001014";

    ctx.font=
    "bold 18px Arial";

    ctx.fillText(
        "EXPLORE →",
        72,
        540
    );


    const texture =
    new THREE.CanvasTexture(
        uiCanvas
    );

    texture.colorSpace =
    THREE.SRGBColorSpace;


    const artScreen =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            5.8,
            3.85
        ),
        new THREE.MeshBasicMaterial({
            map:texture
        })
    );

    artScreen.position.set(
        0,
        0,
        -0.3
    );

    group.add(
        artScreen
    );


    /* titulo exterior */

    const title =
    textSprite(
        data.title,
        "#00ffff",
        42
    );

    title.position.set(
        0,
        -2.65,
        0
    );

    title.scale.set(
        6,
        1.2,
        1
    );

    group.add(title);


    /* luz de la obra */

    const light =
    new THREE.PointLight(
        0x00ffff,
        2,
        8
    );

    light.position.set(
        0,
        0,
        1
    );

    group.add(light);


    /* datos */

    group.userData =
    data;

    return group;
}

/* =========================================================
   MOVIMIENTO
========================================================= */

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false
};

let velocityX=0;
let velocityZ=0;

const acceleration=0.018;
const friction=0.82;
const maxSpeed=0.10;


function keyDown(e){

    if(
        e.key==="w" ||
        e.key==="ArrowUp"
    )
        keys.forward=true;

    if(
        e.key==="s" ||
        e.key==="ArrowDown"
    )
        keys.backward=true;

    if(
        e.key==="a" ||
        e.key==="ArrowLeft"
    )
        keys.left=true;

    if(
        e.key==="d" ||
        e.key==="ArrowRight"
    )
        keys.right=true;
}


function keyUp(e){

    if(
        e.key==="w" ||
        e.key==="ArrowUp"
    )
        keys.forward=false;

    if(
        e.key==="s" ||
        e.key==="ArrowDown"
    )
        keys.backward=false;

    if(
        e.key==="a" ||
        e.key==="ArrowLeft"
    )
        keys.left=false;

    if(
        e.key==="d" ||
        e.key==="ArrowRight"
    )
        keys.right=false;
}


window.addEventListener(
    "keydown",
    keyDown
);

window.addEventListener(
    "keyup",
    keyUp
);


/* =========================================================
   CÁMARA
========================================================= */

let yaw=0;
let pitch=0;

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement ===
            renderer.domElement
        ){

            yaw -= e.movementX*0.0025;

            pitch -=
            e.movementY*0.0025;

            pitch =
            Math.max(
                -1.2,
                Math.min(1.2,pitch)
            );
        }

    }
);


renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(innerWidth>700){

            renderer.domElement.requestPointerLock();

        }

        interact();

    }
);


/* =========================================================
   TOUCH LOOK
========================================================= */

const look =
document.getElementById("look");

let touchX=0;
let touchY=0;

look.addEventListener(
    "touchstart",
    e=>{

        const t=e.touches[0];

        touchX=t.clientX;
        touchY=t.clientY;

    },
    {passive:true}
);


look.addEventListener(
    "touchmove",
    e=>{

        const t=e.touches[0];

        const dx=
        t.clientX-touchX;

        const dy=
        t.clientY-touchY;

        yaw -= dx*.004;
        pitch -= dy*.004;

        pitch=
        Math.max(
            -1.2,
            Math.min(1.2,pitch)
        );

        touchX=t.clientX;
        touchY=t.clientY;

    },
    {passive:true}
);


/* =========================================================

=====================================================
